            </button>
        </div>
    <script src="cart.js"></script>
    <script>
        const CART_KEY = "espresso-edit-cart";

        document.querySelectorAll(".add-to-cart").forEach(button => {
            button.addEventListener("click", () => {
                const product = button.closest(".product");
                const cart = new Cart(JSON.parse(localStorage.getItem(CART_KEY)) || []);

                cart.addItem({
                    id: button.dataset.id,
                    name: product.querySelector("h2").textContent,
                    priceCents: Number(button.dataset.priceCents),
                    image: product.querySelector("img").src
                });

                localStorage.setItem(CART_KEY, JSON.stringify(cart.getItems()));
                alert("Added to cart: " + product.querySelector("h2").textContent);
            });
        });
    </script>
    </body>

</html>
